spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER}
  webhook-url: ${TWILIO_WEBHOOK_URL}
  validate-signature: ${TWILIO_VALIDATE_SIGNATURE:true}

encryption:
  key: ${ENCRYPTION_KEY}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

portal:
  admin-username: ${PORTAL_ADMIN_USERNAME}
  admin-password: ${PORTAL_ADMIN_PASSWORD}
  manager-username: ${PORTAL_MANAGER_USERNAME}
  manager-password: ${PORTAL_MANAGER_PASSWORD}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

media:
  max-dimension: 2048
  jpeg-quality: 0.85
  max-input-bytes: 10485760
  exiftool-path: ${EXIFTOOL_PATH:/usr/bin/exiftool}

logging:
  level:
    com.andela.gbv.demo: ${LOG_LEVEL_APP:INFO}
    com.twilio: INFO
